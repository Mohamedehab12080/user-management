spring.application.name=user-management
# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/usermanagedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=25251436
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8083
# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# Updated Artemis Configuration (non-deprecated)
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=admin
spring.artemis.password=admin

jwt.secret=your-256-bit-base64-encoded-secret-key-here
jwt.expiration=86400

# Pool configuration (optional)
spring.artemis.pool.enabled=true
spring.artemis.pool.max-connections=50