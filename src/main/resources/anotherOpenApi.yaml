openapi: 3.0.1
info:
  title: User Management Service API
  description: API for managing user accounts and Authentication
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Development Server

tags:
  - name: Authentication
    description: User authentication operations
  - name: Users
    description: User management operations
paths :
  /auth/register:
    post:
      tags: [Authentication]
      description: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '400':
          description: Invalid input
        '409':
          description: User already exists
  /auth/login:
    post:
      tags: [Authentication]
      description: Authentication login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref : '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Athentication successful
          content:
            application/json:
              schema:
                type: string
                description: JWT access token
                example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
        '401':
          description: Invalid credentials
        '404':
          description: User not found
  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by id
      parameters:
        - name: id
          in : path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: user not found
      security:
        - bearerAuth: []

    put:
      tags: [ Users ]
      summary: update user by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalide input
        '404':
          description: user not found
      security:
        - bearerAuth: []
    delete:
      tags: [ Users ]
      summary: delete user by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
        '404':
          description: user not found
      security:
        - bearerAuth: [ ]
  /users:
    get:
      tags: [Users]
      summary: Get all users with filtering and pagination
      parameters:
        - name: gender
          in: query
          required: false
          schema:
            type: string
            enum: [MALE,FEMALE,OTHER]
        - name: fullName
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in : query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [fullName,asc,fullName,desc]
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
                  pageable:
                    $ref: '#/components/schemas/Pageable'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  last:
                    type: boolean
      security:
        - bearerAuth: []

components:
  schemas:
    UserRegistrationRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: "securePassword123"
        fullName:
          type: string
          minLength: 2
          example: "Mohamed Ehab"
        gender:
          type: string
          enum: [MALE,FEMALE,OTHER]
          example: "MALE"
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: "securePassword123"
    UserUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          example: "Updated Name"
        gender:
          type: string
          enum: [MALE,FEMALE,OTHER]
          example: [FEMALE]

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "550e8400-e29b-4164-a716-446655440000"
        email:
          type: string
          format: email
          example: "user@example.com"
        fullName:
          type: string
          example: "Mohamed Ehab"
        gender:
          type: string
          enum: [MALE,FEMALE,OTHER]
          example: "MALE"
        createdAt:
          type : string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-02T00:00:00Z"

    Pageable:
      type: object
      properties:
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        unpaged:
          type: boolean
          example: false
        paged:
          type: boolean
          example: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT Authorization header using the Bearer scheme"